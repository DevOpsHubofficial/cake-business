spring.application.name=cake-business

# Datasource configuration (defaults to local PostgreSQL port 5433, overridden by Render/Neon env vars in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/cake_business}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Ibryasfah@032024P}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Allowed CORS origins (comma-separated, with local frontend defaults)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Admin credentials (set via environment variables in production, never commit real secrets)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:Admin@Cake2024!}

# JWT signing secret (min 32 chars, override via env var in production)
jwt.secret=${JWT_SECRET:cake-business-jwt-secret-key-local-dev-32chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}